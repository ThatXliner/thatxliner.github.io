name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Every build contains everything pushed before it, so a
# newer push makes an older run pointless: cancel it rather than let the two
# collide over the single Pages deployment slot.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      # resume.tex is self-contained. An exact source match lets us skip the
      # TeX installation altogether; no fallback keys may serve an older PDF.
      - name: Cache compiled resume
        id: resume-cache
        uses: actions/cache@v5
        with:
          path: public/resume.pdf
          key: resume-pdf-${{ runner.os }}-v1-${{ hashFiles('resume.tex') }}
      - name: Install LaTeX
        if: steps.resume-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra
      - name: Compile resume PDF
        if: steps.resume-cache.outputs.cache-hit != 'true'
        run: pdflatex -interaction=nonstopmode -output-directory=public resume.tex
      - name: Install, build, and upload your site
        uses: withastro/action@v5
        with:
          package-manager: npm@10.9.9
          node-version: 24.22.1
          # The action also caches npm downloads through setup-node.
          cache: true
        env: # Or as an environment variable
          ASTRO_GITHUB_TOKEN: ${{ secrets.ASTRO_GITHUB_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
